# Cloudflare Workers 配置
# 部署前：把 [vars] 里的空值补齐；密钥（DISCORD_TOKEN / DISCORD_PUBLIC_KEY / SUPABASE_KEY）
# 不要写在这里，用 `wrangler secret put <名字>` 设置。
name = "file-share-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 定时任务（每 5 分钟；可在 Cloudflare 后台调整）
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Discord 应用 ID（开发者后台 General Information）
DISCORD_APPLICATION_ID = ""
# 命令注册的服务器 ID（原 bot_config: command_push_guildids）
GUILD_ID = ""
# 日志频道（原 bot_config: logger.log_channel_id）
LOG_CHANNEL_ID = ""
# 归档存储频道（原 bot_config: archive.storage_channel_id）
STORAGE_CHANNEL_ID = ""
# 素材上传单文件上限 MB（原 bot_config: archive.max_upload_size_mb）
MAX_UPLOAD_MB = "10"
# 启用自动打标签的论坛频道，逗号分隔（原 bot_config: auto_tag.enabled_channels）
AUTO_TAG_CHANNELS = ""
# 开发者用户 ID，逗号分隔（原 bot_config: developers_userid；更换api 面板限开发者可用时用）
DEVELOPER_IDS = ""
# 轮询的图床 Discord 频道 ID（图床上传文件自动落入的频道）——部署时必填
POLL_CHANNEL_ID = ""
# 轮询时跳过 bot 自己发的消息（图床是 webhook 推送，webhook 消息会照常处理）
# 论坛频道 ID（原 .env；未单独配置的留空，自动回退到 CHARACTER_FORUM_ID）
CHARACTER_FORUM_ID = ""
WORLDBOOK_FORUM_ID = ""
PRESET_FORUM_ID = ""
TXT_FORUM_ID = ""
# Supabase 项目地址（密钥 SUPABASE_KEY 走 secret）
SUPABASE_URL = "https://qzvexgswuomhmlwhlelq.supabase.co"
# 图床异地备份（可选；留空关闭）
IMGBED_URL = ""
IMGBED_AUTH_CODE = ""
