# Cloudflare Workers 配置
# 部署前：把 [vars] 里的空值补齐；密钥（DISCORD_TOKEN / DISCORD_PUBLIC_KEY / SUPABASE_KEY）
# 不要写在这里，用 `wrangler secret put <名字>` 设置。
name = "file-share-bot"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# 定时任务（每 5 分钟；可在 Cloudflare 后台调整）
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Discord 应用 ID
DISCORD_APPLICATION_ID = "1575322427070615592"
# 命令注册的服务器 ID
GUILD_ID = "1162032547480469645"
# 日志频道
LOG_CHANNEL_ID = "1575035026343460874"
# 归档存储频道
STORAGE_CHANNEL_ID = "1575035148938903663"
# 素材上传单文件上限 MB
MAX_UPLOAD_MB = "10"
# 启用自动打标签的论坛频道，逗号分隔（不用就留空）
AUTO_TAG_CHANNELS = ""
# 开发者用户 ID，逗号分隔
DEVELOPER_IDS = "988099517763174420"
# 自动收档频道
POLL_CHANNEL_ID = "1575035272523939870"
# 论坛频道 ID
CHARACTER_FORUM_ID = "1575035928517279886"
WORLDBOOK_FORUM_ID = "1575036050500354138"
PRESET_FORUM_ID = "1575036105965703178"
TXT_FORUM_ID = "1575036447843680276"
BEAUTY_FORUM_ID = "1575036160714215485"
TOOL_FORUM_ID = "1575036338993107076"

# Supabase 项目地址（密钥 SUPABASE_KEY 走 secret）
SUPABASE_URL = "https://qzvexgswuomhmlwhlelq.supabase.co"
# 图床异地备份（可选；留空关闭）
IMGBED_URL = ""
IMGBED_AUTH_CODE = ""
